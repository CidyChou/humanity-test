app.addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,c=state.current,v=b.dataset.value;switch(a){case'sound':state.sound=!state.sound;b.innerHTML=state.sound?ICON.sound:ICON.mute;b.setAttribute('aria-label',state.sound?'关闭声音':'开启声音');if(state.sound)tone();break;case'home':if(c&&c.started&&!c.finished)modal('中断当前测试？','本项将记为 0 分，已完成的成绩保留。',()=>{if(state.current!==c||c.finished)return;finishAssessment('abandoned');renderHome()});else renderHome();break;case'new':if(state.records.length)modal('重新开始测试？','当前测试记录将被清除。',newGame);else newGame();break;case'resume':startStage(state.records.length);break;case'math':mathKey(v);break;case'mem':memPick(+v);break;case'memundo':c.picks.pop();renderStage();break;case'memsubmit':finishAssessment();break;case'navdir':navMove(v);break;case'robotdir':robotAdd(v);break;case'robotundo':c.queue.pop();renderStage();break;case'robotclear':c.queue=[];renderStage();break;case'robotrun':robotRun();break;case'sort':c.selected=c.selected.includes(+v)?c.selected.filter(x=>x!==+v):[...c.selected,+v];c.feedback='';tone();renderStage();break;case'sortsubmit':sortSubmit();break;case'hint':hint();break;case'auto':autoDo();break;case'share':share();break;case'reportpng':reportPNG();break}});
document.addEventListener('keydown',e=>{let c=state.current;if(state.screen!=='play'||!c||!c.started||c.finished||c.locked||$('.modal-bg'))return;if(c.t.type==='math'){if(/^\d$/.test(e.key))mathKey(e.key);else if(e.key==='Backspace')mathKey('erase');else if(e.key==='Enter')mathKey('submit')}else if(['nav','robot'].includes(c.t.type)){let v={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[e.key];if(v){e.preventDefault();if(c.t.type==='nav')navMove(v);else robotAdd(v)}}});
state.records=load();showLoading(0,renderHome,true);
