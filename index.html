function evaluate(c){let t=c.t,raw=0,detail='',exact=false,correct=0,total=0;switch(t.type){case'math':{total=t.questions.length;correct=t.questions.filter((q,i)=>c.answers[i]===String(q[1])).length;raw=100*correct/total;exact=correct===total;detail=`答对 ${correct}/${total} 题 · 每题等权`;break}case'memory':{let s=expectedMemory(c);total=s.length;correct=s.filter((v,i)=>c.picks[i]===v).length;raw=100*correct/total;exact=correct===total;detail=`正确位置 ${correct}/${total} · 错位 ${c.picks.length-correct} · 未答 ${total-c.picks.length}`;break}case'nav':{let m=maps[t.map],route=dirsFromPath(m.path),dist=editDistance(route,c.moves),arrived=eq(c.pos,m.goal),routePoints=70*Math.max(0,1-dist/route.length);total=route.length;correct=Math.max(0,total-dist);raw=routePoints+(arrived?30:0)-5*c.collisions;exact=arrived&&dist===0&&c.collisions===0;detail=`路线编辑误差 ${dist} · 行走 ${c.moves.length}/${total} 步 · 碰撞 ${c.collisions} · ${arrived?'抵达终点':'未抵达终点'}`;break}case'robot':{let m=maps[t.map],opt=pathfind(m,m.start,m.battery).length+pathfind(m,m.battery,m.goal).length,arrived=eq(c.pos,m.goal),success=arrived&&c.battery&&c.collisions===0;let efficiency=success?30*Math.min(1,opt/Math.max(1,c.queue.length)):0;raw=(c.battery?35:0)+(arrived?35:0)+efficiency-10*c.collisions;exact=success&&c.queue.length===opt;detail=`电池 ${c.battery?'已取':'未取'} · 出口 ${arrived?'已到':'未到'} · ${c.queue.length} 条指令（最优 ${opt}） · 碰撞 ${c.collisions}`;break}case'sort':{let good=targetSort(),tp=c.selected.filter(i=>good.includes(i)).length,fp=c.selected.length-tp;total=good.length;correct=tp;raw=100*Math.max(0,tp-fp)/total;exact=tp===total&&fp===0;detail=`命中 ${tp}/${total} · 漏选 ${total-tp} · 误选 ${fp}`;break}}
return {raw:clampScore(raw),detail,exact,correct,total}}
function finishAssessment(reason='submit',auto=false){let c=state.current;if(!c||c.finished)return;if(reason==='submit'&&!auto&&!c.auto&&c.deadline&&Date.now()>=c.deadline)reason='timeout';let elapsed=c.submitElapsed??(c.deadline?c.t.limit-remaining(c):0);clearTimers();c.auto=auto||c.auto;c.finished=true;c.locked=false;c.running=false;c.active=-1;c.seconds=c.deadline?remaining(c):c.seconds;let e=reason==='abandoned'?{raw:0,detail:'测试中断 · 本项未完成',exact:false}:evaluate(c),mode=c.auto?'auto':c.hints?'hint':'self';let score=mode==='auto'?0:mode==='hint'?Math.round(e.raw*.7):e.raw;let r={id:c.t.id,mode,raw:e.raw,score,detail:e.detail,exact:e.exact&&reason!=='timeout',reason,seconds:elapsed,hints:c.hints,review:reason==='abandoned'?null:{answers:[...c.answers],picks:[...c.picks],moves:[...c.moves]}};state.records[state.i]=r;save();clearActive();document.querySelectorAll('.modal-bg').forEach(el=>el.remove());if(reason!=='abandoned')startStage(state.i+1)}
function complete(auto=false){finishAssessment('submit',auto)}
function progress(){return `<div class="progressline"><div class="number">${String(state.i+1).padStart(2,'0')} / 08</div><div class="segments">${tests.map((t,i)=>`<i class="seg ${i<state.i?'done':i===state.i?'current':''} ${t.offline?'offline':''}"></i>`).join('')}</div><span class="eyebrow" style="letter-spacing:.2px;white-space:nowrap">${state.i<5?'能力评估':'断网模拟'}</span></div>`}
function examiner(c){let t=c.t,r=state.records[state.i],msg=c.finished?(r.mode==='auto'?'任务已代做。此项未验证个人能力。':r.raw===100?'本项测试满分。':r.raw>=60?'已记录部分成绩。请查看失分细项。':'本项测试已记录。错误与未答均计入成绩。'):c.feedback||t.say;return `<div class="examiner"><div class="avatar ${t.offline?'off':''}">${robotSVG(t.offline?'off':'normal')}</div><div class="say"><div class="sayhead"><b>${t.offline?'LOCAL / SYSTEM':'HUMAN-01'}</b><span class="status" style="${t.offline?'color:#ab764c':''}">${t.offline?'● OFFLINE':'● ONLINE'}</span></div><p>${msg}</p></div></div>`}
function rubric(t){return {math:'正确题数 ÷ 总题数 × 100；未答为 0。',memory:'正确位置数 ÷ 序列长度 × 100；错位和未答均为 0。',nav:'路线 70 分（按编辑误差比例扣分）＋抵达 30 分；每次碰撞扣 5 分。',robot:'取电池 35 分、抵达 35 分；成功且无碰撞时指令效率最多 30 分；碰撞扣 10 分。',sort:'(正确选中数 − 误选数) ÷ 目标总数 × 100，最低 0 分。'}[t.type]}
function renderStage(first=false){let c=state.current,t=c.t;let preview=c.phase==='show'||c.phase==='preview';app.innerHTML=headerMarkup()+progress()+examiner(c)+`<section class="stage ${first?'fadein':''}"><div class="stage-head"><div><div class="eyebrow">${t.en}</div><h1>${t.name}</h1><p class="subtitle">${t.level} · 权重 ${weights[state.i]}%</p></div><span class="indexbadge ${t.offline?'offline':''}">${t.offline?'MANUAL':'TEST '+String(state.i+1).padStart(2,'0')}</span></div><div class="assessment-strip"><span>${preview?'观察阶段':'正式作答'}</span><b id="clock" class="${c.seconds<=10?'urgent':''}">${preview?'观察中':String(c.seconds).padStart(2,'0')+'s'}</b><span>单项满分 100</span></div><p class="subtitle task-instruction">${t.sub}</p>${renderPlay(c)}</section>${renderTools(c)}`;if(t.type==='nav'||t.type==='robot')drawBoard(c)}
function reviewMarkup(c){let t=c.t;if(t.type==='math')return `<div class="review">${t.questions.map((q,i)=>`<div><span>${q[0]} = ${q[1]}</span><b class="${c.answers[i]===String(q[1])?'':'wrongtext'}">${c.answers[i]===String(q[1])?'✓':c.answers[i]||'未答'}</b></div>`).join('')}</div>`;if(t.type==='memory')return `<div class="review"><small>标准 / 你的答案（错位标红）</small><div class="sequence-review">${expectedMemory(c).map((v,i)=>`<span class="${c.picks[i]===v?'':'wrongtext'}">${v+1}<small>${c.picks[i]===undefined?'–':c.picks[i]+1}</small></span>`).join('')}</div></div>`;if(t.type==='nav')return `<div class="review"><small>标准路线</small><p class="route-review">${dirsFromPath(maps[t.map].path).join(' ')}</p><small>实际路线</small><p class="route-review">${c.moves.join(' ')||'未行走'}</p></div>`;return ''}
function renderTools(c){let dep=dependency();return `<div class="tools"><div class="dependency"><span>AI 依赖记录</span><div class="meter"><i style="width:${dep}%;background:${dep>=60?'#d58b57':'#6ba17c'}"></i></div><b>${dep}/100</b></div>${c.t.offline?'<div class="offlinebox">⌁ AI 服务离线 · 本项必须独立完成</div>':c.finished||!c.started?'':`<div class="tool-row"><button class="btn secondary" data-action="hint" ${c.locked||c.hints||c.phase==='show'||c.phase==='preview'?'disabled':''}>${ICON.spark} AI 提示</button><button class="btn orange" data-action="auto" ${c.locked||c.phase==='show'||c.phase==='preview'?'disabled':''}>${ICON.bot} 交给 AI</button></div><div class="tool-note">提示：本项原始分 × 70% 计入独立评估 · 代做：计 0 分</div>`}</div>`}
function renderPlay(c){let t=c.t,disabled=c.finished||c.locked;switch(t.type){case'math':{let q=t.questions[Math.min(c.answers.length,t.questions.length-1)];return `<div class="math-screen"><div class="eyebrow">QUESTION ${Math.min(c.answers.length+1,t.questions.length)} / ${t.questions.length}</div><div class="equation" style="font-size:clamp(20px,6vw,34px)">${q[0]} = ?</div><div class="answer ${c.input?'':'empty'}">${c.input||'_'}</div></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','erase','0','submit'].map(k=>`<button class="key ${k==='submit'?'submit':k==='erase'?'erase':''}" data-action="math" data-value="${k}" ${disabled?'disabled':''}>${k==='erase'?'⌫':k==='submit'?'✓':k}</button>`).join('')}</div><div class="mini-status">已提交 ${c.answers.length}/${t.questions.length} · 不提供即时正误</div>`}case'memory':return `<div class="memorygrid">${Array.from({length:9},(_,i)=>`<button aria-label="记忆格 ${i+1}" data-action="mem" data-value="${i}" class="mem ${c.active===i?'lit':''}" ${disabled||c.phase!=='input'?'disabled':''}><span>${String(i+1).padStart(2,'0')}</span></button>`).join('')}</div><div class="progressdots">${t.seq.map((_,i)=>`<i class="${i<c.picks.length?'filled':''}"></i>`).join('')}</div><div class="mini-status">${c.finished?'输入已归档':c.phase==='show'?'观察序列 '+c.memIndex+'/'+t.seq.length:`${t.reverse?'倒序':'正序'}输入 · ${c.picks.length}/${t.seq.length}`}</div>${c.phase==='input'&&!disabled?`<div class="tool-row"><button class="btn secondary small" data-action="memundo" ${!c.picks.length?'disabled':''}>撤销末位</button><button class="btn primary small" data-action="memsubmit">提交现有答案</button></div>`:''}`;
case'nav':return `<div class="boardwrap"><canvas class="board" id="gameboard" width="720" height="640" aria-label="导航地图"></canvas></div><div class="mini-status">${c.finished?'路线已归档':c.phase==='preview'?'导航将在 '+c.navRemaining+' 秒后关闭':`已走 ${c.moves.length} / ${maps[t.map].path.length-1} 步 · 碰撞 ${c.collisions}`}</div>${c.phase==='walk'&&!disabled?`<div class="controls">${dirButtons('navdir',false)}</div><div class="mini-status">${t.offline?'抵达通讯节点':'抵达指定房屋'}后自动结算</div>`:''}`;
case'robot':return `<div class="boardwrap"><canvas class="board" id="gameboard" width="720" height="500" aria-label="机器人编程棋盘"></canvas></div><div class="queue-row"><small>指令队列 · ${c.queue.length}/${t.maxQueue}</small><small>${c.battery?'电池已取':'先取电池'}</small></div><div class="queue">${Array.from({length:t.maxQueue},(_,i)=>`<span class="slot ${i>=c.queue.length?'empty':''} ${i<c.executed?'executed':''}">${c.queue[i]||'·'}</span>`).join('')}</div><div class="controls">${dirButtons('robotdir',disabled||c.queue.length>=t.maxQueue)}</div><div class="tool-row"><button class="btn secondary small" data-action="robotundo" ${disabled||!c.queue.length?'disabled':''}>撤销末条</button><button class="btn secondary small" data-action="robotclear" ${disabled?'disabled':''}>清空</button><button class="btn primary small" data-action="robotrun" ${disabled||!c.queue.length?'disabled':''}>提交并执行</button></div>`;
case'sort':return `<div class="rules"><span class="rule"><i class="blue"></i>蓝色圆形</span><span class="rule"># 偶数</span><span class="rule">✓ 已验证</span></div><div class="sortgrid dense">${parcels.map((p,i)=>`<button data-action="sort" data-value="${i}" class="parcel ${c.selected.includes(i)?'selected':''}" ${disabled?'disabled':''} aria-label="${i+1}号，${p.shape}，${p.n}，${p.stamp?'已验证':'未验证'}">${c.selected.includes(i)?'<span class="check">✓</span>':''}${p.stamp?'<span class="stamp">✓</span>':''}<span class="shape ${p.shape}" style="background:${({'#679bbd':'#4389ef','#d89a68':'#f39a4e','#83aa77':'#4ecb87'})[p.c]||p.c}"></span><span class="num">${p.n}</span></button>`).join('')}</div><button class="btn primary full" data-action="sortsubmit" ${disabled?'disabled':''}>提交筛选 · 已选 ${c.selected.length} 项</button>`}}
function mathKey(v){let c=state.current;if(!c.started||c.finished||c.locked)return;if(v==='erase')c.input=c.input.slice(0,-1);else if(v==='submit'){if(!c.input)return;c.answers.push(c.input);c.input='';if(c.answers.length===c.t.questions.length){finishAssessment();return}tone()}else if(c.input.length<6)c.input+=v;c.feedback='';renderStage()}
function memoryStart(){let c=state.current,t=c.t;c.phase='show';c.memIndex=0;c.active=-1;renderStage();t.seq.forEach((v,i)=>{later(()=>{c.active=v;c.memIndex=i+1;tone();renderStage()},350+i*t.flash);later(()=>{c.active=-1;renderStage()},350+i*t.flash+Math.round(t.flash*.65))});later(()=>{c.phase='input';c.active=-1;clock(c);renderStage()},350+t.seq.length*t.flash)}
function memPick(i){let c=state.current;if(c.finished||c.locked||c.phase!=='input'||c.picks.length>=c.t.seq.length)return;c.picks.push(i);tone();renderStage()}
function navStart(){let c=state.current;c.phase='preview';c.showPath=true;c.navRemaining=c.t.preview;renderStage();for(let i=1;i<=c.t.preview;i++)later(()=>{c.navRemaining=c.t.preview-i;if(i===c.t.preview)navGo();else renderStage()},1000*i)}

function robotRun(auto=false){let c=state.current,m=maps.robot;if(c.finished||c.running||(!c.queue.length&&!auto))return;c.running=true;c.locked=true;if(auto)c.queue=[...pathfind(m,m.start,m.battery),...pathfind(m,m.battery,m.goal)];if(c.deadline&&Date.now()>=c.deadline&&!auto){finishAssessment('timeout');return}c.submitElapsed=c.deadline?c.t.limit-remaining(c):0;c.seconds=remaining(c);stopClock();c.deadline=0;renderStage();let idx=0;function tick(){if(idx>=c.queue.length){finishAssessment('submit',auto);return}let p=step(m,c.pos,c.queue[idx]);if(!p){c.collisions++;finishAssessment('collision',auto);return}c.trail.push(c.pos);c.pos=p;c.battery=c.battery||eq(p,m.battery);c.executed=++idx;tone();renderStage();later(tick,160)}later(tick,150)}

function autoDo(){let c=state.current,t=c.t;if(t.offline||c.finished||c.locked||!c.started)return;clearTimers();c.auto=true;markActive(c);c.locked=true;c.feedback='AI 正在自动执行…';switch(t.type){case'math':c.answers=t.questions.map(q=>String(q[1]));c.input=c.answers.at(-1);renderStage();later(()=>finishAssessment('submit',true),600);break;case'memory':c.picks=expectedMemory(c);renderStage();later(()=>finishAssessment('submit',true),600);break;case'nav':{let m=maps[t.map],route=dirsFromPath(m.path),i=0;c.pos=[...m.start];c.moves=[];c.trail=[];c.collisions=0;c.showPath=true;c.phase='walk';function go(){if(i===route.length){finishAssessment('submit',true);return}let d=route[i++];c.trail.push(c.pos);c.pos=step(m,c.pos,d);c.moves.push(d);renderStage();later(go,110)}go();break}case'robot':c.locked=false;robotRun(true);break;case'sort':c.selected=targetSort();renderStage();later(()=>finishAssessment('submit',true),550);break}}
function reportStats(){let r=state.records,score=Math.round(r.reduce((s,x,i)=>s+x.score*weights[i]/100,0)*10)/10,raw=Math.round(r.reduce((s,x,i)=>s+x.raw*weights[i]/100,0)*10)/10,final=r[7]?.exact&&r[7]?.mode==='self',self=r.filter(x=>x.mode==='self').length,grade=score>=90&&final&&self===8?'S':score>=80?'A':score>=65?'B':score>=45?'C':'D';return {r,score,raw,final,self,grade}}
function savedReview(t,r){if(!r.review||!['math','memory','nav'].includes(t.type))return '';let v=r.review;let clean=(a,f)=>Array.isArray(a)?a.filter(f):[];let c={t,answers:clean(v.answers,x=>typeof x==='string'&&/^\d{1,6}$/.test(x)),picks:clean(v.picks,x=>Number.isInteger(x)&&x>=0&&x<=8),moves:clean(v.moves,x=>DIRS.some(d=>d[0]===x))};return `<details class="report-review"><summary>查看答题复盘</summary>${reviewMarkup(c)}</details>`}
function renderReport(){clearTimers();state.screen='report';state.current=null;let {r,score,raw,final,self,grade}=reportStats();app.innerHTML=headerMarkup()+`<section class="report fadein"><div class="report-hero"><div class="eyebrow">HUMAN CAPABILITY LAB / ${protocol}</div><div class="report-heading"><div><h1>独立能力报告</h1><p>标准化游戏协议 · 8 项固定任务</p></div><div class="grade-mark">${grade}</div></div><div class="report-score">${score.toFixed(1)}<span>/100</span></div><p>加权独立评估分 · ${final?'极限挑战通过':'极限挑战未通过'}</p><div class="report-grid"><div class="metric"><b>${raw.toFixed(1)}</b><small>任务原始分</small></div><div class="metric"><b>${self}/8</b><small>无 AI 辅助</small></div><div class="metric"><b>${dependency()}</b><small>AI 依赖记录</small></div></div></div><div class="report-list"><h2>分项成绩 / 100</h2>${r.map((x,i)=>`<div class="assessment-row"><div class="assessment-row-top"><span>${String(i+1).padStart(2,'0')}　${tests[i].name}</span><b>${x.score}<small> / ${x.raw} 原始</small></b></div><div class="scorebar"><i style="width:${x.score}%"></i></div><div class="assessment-detail">${x.detail}</div><div class="assessment-meta">${x.mode==='auto'?'AI 代做 · 不计独立分':x.mode==='hint'?'AI 提示 · ×0.7':'独立作答'} · 权重 ${weights[i]}%${x.reason==='timeout'?' · 超时':x.reason==='abandoned'?' · 中断':''}</div>${savedReview(tests[i],x)}</div>`).join('')}</div><div class="report-list methodology"><h2>评分说明</h2><p>综合分 = 各项独立评估分 × 权重之和。AI 提示计原始分的 70%，代做计 0；原始分单独展示。</p><p>等级：S ≥90 且全程无 AI、极限通过；未达 S 条件时 A ≥80；B ≥65；C ≥45；D &lt;45。极限通过 = 20 步完全匹配、零碰撞、规定时间内抵达终点。</p><p><b>极限关设计目标：约 5% 首次独立通过。</b> 当前尚未收集足够玩家样本验证该目标，等级不是人口百分位。</p><p>本报告是游戏成绩，不是 IQ、临床认知测评或真实人群排名。重复挑战可能提高分数。</p></div><button class="btn primary full" data-action="share">分享测试成绩</button><button class="btn secondary full" data-action="reportpng">保存成绩卡图片</button><button class="btn secondary full" data-action="new">重新测试</button></section>`;window.scrollTo(0,0)}
async function share(){let {score,raw,final,self,grade}=reportStats(),text=`《人类退化测试》${protocol}\n独立评估 ${score.toFixed(1)}/100 · ${grade} 级\n原始任务分 ${raw.toFixed(1)}/100 · 无 AI ${self}/8\n极限挑战：${final?'通过':'未通过'}\n这是游戏成绩，不是人群排名。你能拿多少分？`;try{if(navigator.share){await navigator.share({title:'人类退化测试',text});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('成绩已复制');return}}catch(e){if(e.name==='AbortError')return}let el=document.createElement('textarea');el.value=text;document.body.append(el);el.select();try{document.execCommand('copy');toast('成绩已复制')}catch{toast('请手动复制成绩')}el.remove()}
function reportPNG(){let {r,score,raw,final,self,grade}=reportStats(),cv=document.createElement('canvas');cv.width=750;cv.height=1100;let x=cv.getContext('2d');x.fillStyle='#244dcc';x.fillRect(0,0,750,1100);const panel=(a,b,w,h,r,fill)=>{x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();x.strokeStyle='#172451';x.lineWidth=5;x.stroke()};panel(30,34,690,316,25,'#463bbd');panel(30,367,690,590,22,'#f9f9ff');const txt=(v,a,b,size=24,color='#1c2344',weight='600')=>{x.fillStyle=color;x.font=`${weight} ${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;x.fillText(v,a,b)};txt('HUMAN / 01     '+protocol,60,84,21,'#d5dcff');txt('人类退化测试 · 独立能力报告',60,137,32,'#ffffff','800');txt(score.toFixed(1),60,245,92,'#ffdf65','800');txt('/ 100     '+grade+' 级',330,240,31,'#e0e7ff');txt('原始 '+raw.toFixed(1)+'  ·  无 AI '+self+'/8  ·  极限'+(final?'通过':'未通过'),60,306,24,'#e0e7ff');r.forEach((a,i)=>{let y=409+i*68;txt(tests[i].name,60,y,25);txt(String(a.score),632,y,26);x.fillStyle='#dbe4ff';x.fillRect(60,y+12,630,9);x.fillStyle='#5475e8';x.fillRect(60,y+12,630*a.score/100,9)});txt('游戏内评分 · 非 IQ 或真实人群排名',60,1000,23,'#e0e7ff');txt('当 AI 替你完成一切，你还会什么？',60,1044,26,'#ffffff');let a=document.createElement('a');a.download='HUMAN-01-report.png';a.href=cv.toDataURL('image/png');a.click()}
app.addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,c=state.current,v=b.dataset.value;switch(a){case'sound':state.sound=!state.sound;b.innerHTML=state.sound?ICON.sound:ICON.mute;b.setAttribute('aria-label',state.sound?'关闭声音':'开启声音');if(state.sound)tone();break;case'home':if(c&&c.started&&!c.finished)modal('中断当前测试？','本项将记为 0 分，已完成的成绩保留。',()=>{if(state.current!==c||c.finished)return;finishAssessment('abandoned');renderHome()});else renderHome();break;case'new':if(state.records.length)modal('重新开始测试？','当前测试记录将被清除。',newGame);else newGame();break;case'resume':startStage(state.records.length);break;case'math':mathKey(v);break;case'mem':memPick(+v);break;case'memundo':c.picks.pop();renderStage();break;case'memsubmit':finishAssessment();break;case'navdir':navMove(v);break;case'robotdir':robotAdd(v);break;case'robotundo':c.queue.pop();renderStage();break;case'robotclear':c.queue=[];renderStage();break;case'robotrun':robotRun();break;case'sort':c.selected=c.selected.includes(+v)?c.selected.filter(x=>x!==+v):[...c.selected,+v];c.feedback='';tone();renderStage();break;case'sortsubmit':sortSubmit();break;case'hint':hint();break;case'auto':modal('交给 AI 完成？','本项任务原始分仍会记录，但独立评估分计为 0。',()=>{if(state.current===c&&!c.finished)autoDo()});break;case'share':share();break;case'reportpng':reportPNG();break}});
document.addEventListener('keydown',e=>{let c=state.current;if(state.screen!=='play'||!c||!c.started||c.finished||c.locked||$('.modal-bg'))return;if(c.t.type==='math'){if(/^\d$/.test(e.key))mathKey(e.key);else if(e.key==='Backspace')mathKey('erase');else if(e.key==='Enter')mathKey('submit')}else if(['nav','robot'].includes(c.t.type)){let v={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[e.key];if(v){e.preventDefault();if(c.t.type==='nav')navMove(v);else robotAdd(v)}}});
state.records=load();renderHome();
</script></body></html>
